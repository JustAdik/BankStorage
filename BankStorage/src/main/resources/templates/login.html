<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Bank of Kazakhstan</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- шрифт -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&display=swap" rel="stylesheet">

    <style>
        :root{
          --kz-blue:#00A3DD;
          --kz-blue-dark:#008bbd;
        }

        body{
          font-family: "Montserrat", sans-serif;
          min-height:100vh;
          background: radial-gradient(1200px 1200px at 100% 0, #5fd3ff 0%, var(--kz-blue) 40%, #0077a3 100%);
          display:flex; align-items:center; justify-content:center;
        }

        .card{
          border:none;
          border-radius:20px;
          box-shadow: 0 20px 60px rgba(0,0,0,.3);
        }

        .card-header{
          background: var(--kz-blue);
          color:white;
          text-align:center;
          padding:25px;
        }

        .btn-kz{
          background: var(--kz-blue);
          color:white;
          border:none;
          border-radius:10px;
          padding:10px;
          font-weight:700;
        }

        .btn-kz:hover{
          background: var(--kz-blue-dark);
        }

    </style>
</head>

<body>

<div class="container" style="max-width: 450px;">
    <div class="card">

        <div class="card-header">
            <h4>Bank</h4>
            <div>Вход в аккаунт</div>
        </div>

        <div class="card-body">

            <div th:if="${param.error}" class="alert alert-danger">
                Неверный логин или пароль
            </div>

            <form th:action="@{/login}" method="post">

                <div class="mb-3">
                    <label>Логин</label>
                    <input type="text" name="username" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label>Пароль</label>
                    <input type="password" name="password" class="form-control" required>
                </div>

                <button type="submit" class="btn btn-kz w-100">Войти</button>
            </form>

            <div class="text-center mt-3">
                <a th:href="@{/register}" style="color:#00A3DD; font-weight:700;">
                    Нет аккаунта? Регистрация
                </a>
            </div>

        </div>
    </div>
</div>

</body>
</html>
