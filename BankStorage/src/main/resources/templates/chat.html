<!DOCTYPE html>

<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Bank Chat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&display=swap" rel="stylesheet">

    <style>
        :root{
            --kz-blue:#00A3DD;
            --kz-blue-dark:#008bbd;
        }

        body{
            font-family: "Montserrat", sans-serif;
            min-height:100vh;
            background: radial-gradient(
                    1200px 1200px at 100% 0,
                    #5fd3ff 0%,
                    var(--kz-blue) 40%,
                    #0077a3 100%
            );
            display:flex;
            align-items:center;
            justify-content:center;
            padding:20px;
        }

        .chat-card{
            width:700px;
            height:800px;
            background:white;
            border-radius:20px;
            overflow:hidden;
            box-shadow:0 20px 60px rgba(0,0,0,.3);
            display:flex;
            flex-direction:column;
        }

        .chat-header{
            background:var(--kz-blue);
            color:white;
            padding:20px;
            font-size:20px;
            font-weight:700;
        }

        .chat-body{
            flex:1;
            overflow-y:auto;
            padding:20px;
            background:#f5f7fa;
        }

        .chat-footer{
            padding:15px;
            border-top:1px solid #ddd;
            background:white;
        }

        .my-message{
            display:flex;
            justify-content:flex-end;
            margin-bottom:15px;
        }

        .other-message{
            display:flex;
            justify-content:flex-start;
            margin-bottom:15px;
        }

        .bubble{
            max-width:70%;
            padding:12px 15px;
            border-radius:15px;
            word-break:break-word;
        }

        .my-message .bubble{
            background:var(--kz-blue);
            color:white;
        }

        .other-message .bubble{
            background:#e9ecef;
            color:black;
        }

        .message-time{
            display:block;
            text-align:right;
            font-size:11px;
            margin-top:5px;
            opacity:.8;
        }
    </style>

</head>

<body>

<div class="chat-card">

    <div class="chat-header">
        Чат с
        <span th:text="${receiver.username}"></span>
    </div>

    <div class="chat-body">

        <div class="date-divider"
             th:if="${!#lists.isEmpty(messages)}">

        <span th:text="${#temporals.format(messages[0].date,'dd MMMM yyyy')}">
        </span>

        </div>

        <div th:each="message : ${messages}">

            <div class="my-message"
                 th:if="${message.senderMessage == currentUser.username}">

                <div class="bubble">

                    <div th:text="${message.text}"></div>

                    <small class="message-time"
                           th:text="${#temporals.format(message.date,'HH:mm')}">
                    </small>

                </div>

            </div>

            <div class="other-message"
                 th:if="${message.senderMessage != currentUser.username}">

                <div class="bubble">

                    <div th:text="${message.text}"></div>

                    <small class="message-time"
                           th:text="${#temporals.format(message.date,'HH:mm')}">
                    </small>

                </div>

            </div>

        </div>

    </div>

    <div class="chat-footer">

        <form th:action="@{/chat}" method="post">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <input type="hidden"
                   name="receiver"
                   th:value="${receiver.username}">

            <div class="input-group">

                <input type="text"
                       name="text"
                       class="form-control"
                       placeholder="Введите сообщение..."
                       required>

                <button type="submit"
                        class="btn btn-primary">
                    Отправить
                </button>

            </div>

        </form>

    </div>

</div>

</body>
</html>
