<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Поиск пользователя</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root{
          --kz-blue:#00A3DD;
          --kz-blue-dark:#008bbd;
        }

        body{
          font-family: "Montserrat", sans-serif;
          min-height:100vh;
          background: radial-gradient(1200px 1200px at 100% 0, #5fd3ff 0%, var(--kz-blue) 40%, #0077a3 100%);
          display:flex; align-items:center; justify-content:center;
        }

        .card{
          border:none;
          border-radius:20px;
          box-shadow: 0 20px 60px rgba(0,0,0,.3);
        }

        .card-header{
          background: var(--kz-blue);
          color:white;
          text-align:center;
          padding:25px;
        }

        .btn-kz{
          background: var(--kz-blue);
          color:white;
          border:none;
          border-radius:10px;
          padding:10px;
          font-weight:700;
        }

        .btn-kz:hover{
          background: var(--kz-blue-dark);
        }
    </style>
</head>
<body>

<div class="container">

    <div class="search-card">

        <h2 class="text-center mb-4">Поиск пользователя</h2>

        <form action="/search" method="get">

            <div class="mb-3">
                <label class="form-label">Номер счета</label>
                <input
                        type="text"
                        class="form-control"
                        name="receiverAccount"
                        placeholder="Введите номер счета"
                        required>
            </div>

            <button class="btn btn-light w-100">
                Найти
            </button>

        </form>

        <div th:if="${receiver != null}" class="user-card">

            <h4 class="mb-3">Найденный пользователь</h4>

            <p>
                <strong>Имя:</strong>
                <span th:text="${receiver.username}"></span>
            </p>

            <p>
                <strong>Номер счета:</strong>
                <span th:text="${receiver.identicalNumber}"></span>
            </p>

            <p>
                <strong>Роль:</strong>
                <span th:text="${receiver.role}"></span>
            </p>

        </div>

        <div th:if="${error != null}" class="alert alert-danger mt-3">
            <span th:text="${error}"></span>
        </div>

        <div class="text-center mt-4">
            <a href="/bank" class="btn btn-outline-light">
                Назад
            </a>
        </div>

    </div>

</div>

</body>
</html>
