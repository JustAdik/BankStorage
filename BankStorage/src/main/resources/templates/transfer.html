<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Перевод денег</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

  <style>
    :root{
      --kz-blue:#00A3DD;
      --kz-blue-dark:#008bbd;
    }

    body{
      font-family: "Montserrat", sans-serif;
      min-height:100vh;
      background: radial-gradient(1200px 1200px at 100% 0, #5fd3ff 0%, var(--kz-blue) 40%, #0077a3 100%);
      display:flex; align-items:center; justify-content:center;
    }

    .card{
      border:none;
      border-radius:20px;
      box-shadow: 0 20px 60px rgba(0,0,0,.3);
    }

    .card-header{
      background: var(--kz-blue);
      color:white;
      text-align:center;
      padding:25px;
    }

    .btn-kz{
      background: var(--kz-blue);
      color:white;
      border:none;
      border-radius:10px;
      padding:10px;
      font-weight:700;
    }

    .btn-kz:hover{
      background: var(--kz-blue-dark);
    }

  </style>
</head>
<body>

<div class="container mt-5">

  <div class="card shadow p-4">

    <h2>Перевод денег</h2>

    <form th:action="@{/transfer}" method="post">

      <div class="mb-3">
        <label>Номер счета получателя</label>

        <input type="text"
               name="receiverAccount"
               class="form-control"
               placeholder="KZ000002"
               required>
      </div>

      <div class="mb-3">
        <label>Сумма</label>

        <input type="number"
               name="amount"
               class="form-control"
               required>
      </div>

      <button type="submit"
              class="btn btn-success">
        Перевести
      </button>

    </form>

  </div>

</div>

</body>
</html>
