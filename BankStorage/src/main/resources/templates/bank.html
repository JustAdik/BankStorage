<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bank of Kazakhstan</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
          --kz-blue: #00A3DD;
          --kz-blue-dark: #008bbd;
          --soft-white: #ffffff;
        }

        body {
          font-family: "Montserrat", sans-serif;
          background: radial-gradient(1200px 1200px at 100% 0,
              #5fd3ff 0%, var(--kz-blue) 40%, #0077a3 80%);
          min-height: 100vh;
          color: var(--soft-white);
        }

        .card-option {
          border: none;
          border-radius: 20px;
          padding: 25px;
          background: rgba(255, 255, 255, 0.08);
          backdrop-filter: blur(6px);
          transition: 0.3s;
          cursor: pointer;
        }

        .card-option:hover {
          background: rgba(255, 255, 255, 0.18);
          transform: translateY(-5px);
        }

        .card-option h3 {
          font-weight: 700;
          margin-bottom: 10px;
          font-size: 1.4rem;
        }

        a {
          text-decoration: none;
          color: inherit;
        }

        header {
          text-align: center;
          padding: 40px 20px;
        }

        header h1 {
          font-size: 2.4rem;
          font-weight: 700;
        }

        header p {
          font-size: 1.1rem;
          opacity: 0.9;
        }

    </style>
</head>

<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bank of Kazakhstan</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
          --kz-blue: #00A3DD;
          --kz-blue-dark: #008bbd;
          --soft-white: #ffffff;
        }

        body {
          font-family: "Montserrat", sans-serif;
          background: radial-gradient(1200px 1200px at 100% 0,
              #5fd3ff 0%, var(--kz-blue) 40%, #0077a3 80%);
          min-height: 100vh;
          color: var(--soft-white);
        }

        .card-option {
          border: none;
          border-radius: 20px;
          padding: 25px;
          background: rgba(255, 255, 255, 0.08);
          backdrop-filter: blur(6px);
          transition: 0.3s;
          cursor: pointer;
        }

        .card-option:hover {
          background: rgba(255, 255, 255, 0.18);
          transform: translateY(-5px);
        }

        .card-option h3 {
          font-weight: 700;
          margin-bottom: 10px;
          font-size: 1.4rem;
        }

        a {
          text-decoration: none;
          color: inherit;
        }

        header {
          text-align: center;
          padding: 40px 20px;
        }

        header h1 {
          font-size: 2.4rem;
          font-weight: 700;
        }

        header p {
          font-size: 1.1rem;
          opacity: 0.9;
        }

    </style>
</head>

<header>
    <h1>Bank of Kazakhstan</h1>
    <p></p>
</header>

<body>

<div class="card border-0 shadow-lg mb-4"
     style="border-radius: 25px; background: linear-gradient(135deg, #ffffff, #f8f9fa);">

    <div class="card-body text-center p-5">

        <h5 class="text-secondary mb-3">
            Текущий баланс
        </h5>

        <h1 class="display-2 fw-bold text-success"
            th:text="${user.balance} + ' ₸'">
            0 ₸
        </h1>

        <p class="text-muted mt-2">
            Доступно для операций
        </p>

    </div>

</div>

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card border-0 shadow">
            <div class="card-body text-center">

                <h4>
                    👤 Пользователь
                </h4>

                <hr>

                <p>
                    <strong>Логин:</strong>
                    <span th:text="${user.username}"></span>
                </p>

                <p>
                    <strong>Роль:</strong>
                    <span th:text="${user.role}"></span>
                </p>

                <p>
                    <strong>Номер счёта:</strong>
                    <span th:text="${user.identicalNumber}"></span>
                </p>

            </div>
        </div>

    </div>

</div>

<!--        <div class="col-md-4">-->
<!--            <div class="card info-card mb-3">-->
<!--                <div class="card-body text-center">-->
<!--                    <h5>Возраст</h5>-->
<!--                    <p th:text="${user.age}"></p>-->
<!--                </div>-->
<!--            </div>-->
<!--        </div>-->


</div>

<div class="row mt-4">

    <div class="col-md-4">
        <form th:action="@{/topup}" method="post" class="d-flex me-2">
            <input type="number" name="amount" placeholder="Сумма" required class="form-control form-control-sm me-2"/>
            <button type="submit" class="btn btn-warning btn-sm">Пополнить</button>
        </form>
    </div>

    <div class="col-md-4">
        <a href="/transfer"
           class="btn btn-warning w-100 action-btn">
            💸 Перевод
        </a>
    </div>

    <div class="col-md-4">
        <a href="/history"
           class="btn btn-info w-100 action-btn">
            📄 История
        </a>
    </div>

    <div class="col-md-4">
        <a href="/search"
           class="btn btn-info w-100 action-btn">
            📄 Поиск
        </a>
    </div>

</div>

<div class="mt-5 text-center">
    <form th:action="@{/logout}" method="post">
        <button type="submit"
                class="btn btn-danger">
            Выйти
        </button>
    </form>
</div>

</div>

</body>

</html>

</body>

</html>
