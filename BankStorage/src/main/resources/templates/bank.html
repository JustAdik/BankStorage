<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bank of Kazakhstan</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
          --kz-blue: #00A3DD;
          --kz-blue-dark: #008bbd;
          --soft-white: #ffffff;
        }

        body {
          font-family: "Montserrat", sans-serif;
          background: radial-gradient(1200px 1200px at 100% 0,
              #5fd3ff 0%, var(--kz-blue) 40%, #0077a3 80%);
          min-height: 100vh;
          color: var(--soft-white);
        }

        .card-option {
          border: none;
          border-radius: 20px;
          padding: 25px;
          background: rgba(255, 255, 255, 0.08);
          backdrop-filter: blur(6px);
          transition: 0.3s;
          cursor: pointer;
        }

        .card-option:hover {
          background: rgba(255, 255, 255, 0.18);
          transform: translateY(-5px);
        }

        .card-option h3 {
          font-weight: 700;
          margin-bottom: 10px;
          font-size: 1.4rem;
        }

        a {
          text-decoration: none;
          color: inherit;
        }

        header {
          text-align: center;
          padding: 40px 20px;
        }

        header h1 {
          font-size: 2.4rem;
          font-weight: 700;
        }

        header p {
          font-size: 1.1rem;
          opacity: 0.9;
        }

    </style>
</head>
<body>


<header>
    <h1>Bank of Kazakhstan</h1>
    <p></p>
</header>


</html>
